apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/red-hat-data-services/RHOAI-Build-Config?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    # No build-nudge-files: this image is deleted with its branch. The gate's
    # answer is FBC_IMAGE_REF_BY_DIGEST, not a nudge.
    #
    # One arm only. rhoai-3.6 is already built by rhoai-fbc-fragment-v3-6-push.yaml.
    #
    # eg-fbc- is deliberately disjoint from eg-bundle-: the bundle file fires on
    # eg-bundle-* with an "early-gate:" subject, which is exactly the shape of
    # this block's push, so a shared branch would rebuild the bundle every time.
    #
    # The "early-gate:" subject is load-bearing: creating the branch is itself a
    # push, and the fork inherits the release branch's tip commit, so without it
    # PaC builds the unprocessed release catalog and the monitor reports that as
    # the gate's answer. pathChanged() cannot substitute - a new branch has no
    # diff base, and the processed push may legitimately be empty.
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push"
      && target_branch.startsWith("eg-fbc-")
      && event_title.startsWith("early-gate:")
  labels:
    appstudio.openshift.io/application: rhoai-early-gate
    appstudio.openshift.io/component: rhoai-fbc-fragment-eg
    pipelines.appstudio.openshift.io/type: build
  name: rhoai-fbc-fragment-eg-on-push
  namespace: rhoai-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  # Public repo, as the bundle: the monitors use quay's anonymous token, which
  # the release repos answer with 401. A fallback value - the gate rewrites it on
  # the ephemeral branch - and it must stay in step with image-tag on
  # monitor-fbc-build in konflux-central's early-gate pipeline.
  - name: output-image
    value: quay.io/rhoai/pull-request-pipelines:rhoai-fbc-fragment-{{target_branch}}-{{revision}}
  - name: rhoai-version
    value: "3.6.0"
  - name: build-type
    value: "ci"
  - name: dockerfile
    value: Dockerfile
  # One OCP version: the gate regenerates a single catalog directory. Keep in
  # step with fbc-openshift-version in the gate.
  - name: path-context
    value: catalog/v4.19
  - name: hermetic
    value: true
  # false, as the release file. This is the one that matters most: skip-checks
  # would also drop validate-fbc, which is the only thing checking opm graph
  # validity - verify-fbc-images checks references, not structure.
  - name: skip-checks
    value: false
  - name: build-source-image
    value: true
  # true, as the release file: fbc-fragment-build.yaml tags per platform and
  # leaves build-image-index to create the index carrying the plain tag - which
  # is the tag the monitor polls for.
  - name: build-image-index
    value: true
  - name: build-platforms
    value:
    - linux/x86_64
    - linux/ppc64le
    - linux/s390x
    - linux/arm64
  - name: build-args-file
    value: catalog/catalog_build_args.map
  # No skip-fips-check, enable-slack-* or enable-downstream-triggers: not declared
  # by fbc-fragment-build.yaml on konflux-central@rhoai-3.6, and an undeclared
  # param fails the run at validation.
  #
  # The POC used skip-fips-check to drop fbc-fips-check-oci-ta, whose own 6h
  # timeout does not fit the monitor's budget, while keeping validate-fbc. That
  # split is not available here, so the FIPS check runs. If it outlasts the
  # monitor, raise fbc-build-timeout-minutes in the gate - not skip-checks.
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    # A literal branch, not '{{ target_branch }}': the eg-fbc-* branches are
    # created by the gate in THIS repo and never exist in konflux-central, so
    # target_branch would not resolve and no build would start. rhoai-3.6 rather
    # than main so the gate uses the pipeline the release uses. Bump with the branch.
    - name: revision
      value: 'rhoai-3.6'
    - name: pathInRepo
      value: pipelines/fbc-fragment-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-rhoai-fbc-fragment-eg
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
