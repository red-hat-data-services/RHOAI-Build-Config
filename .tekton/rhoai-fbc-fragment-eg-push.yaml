apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/red-hat-data-services/RHOAI-Build-Config?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    # No build.appstudio.openshift.io/build-nudge-files, on purpose.  An
    # early-gate fragment is a throwaway validation of an ephemeral branch and
    # must never open a nudge PR: the image it names is deleted with the
    # branch.  The gate's answer is FBC_IMAGE_REF_BY_DIGEST, not a nudge.
    #
    # One trigger only: an eg-fbc-* branch carrying an "early-gate:" commit
    # subject.  The release branch is already covered by
    # rhoai-fbc-fragment-v3-6-push.yaml, so a second arm matching rhoai-3.6
    # would build every release push twice.
    #
    # The eg-fbc- prefix is deliberately disjoint from eg-bundle-.  Block 3
    # could have reused Block 2's branch, but the bundle file fires on
    # eg-bundle-* with an "early-gate:" subject - precisely the shape of this
    # block's catalog push - so sharing a branch would rebuild the bundle on
    # every FBC push.
    #
    # The subject check is load-bearing.  Creating the branch is itself a push
    # event, and a freshly forked eg-fbc-<uid> inherits the release branch's
    # tip commit, whose subject is an ordinary merge message.  Without it PaC
    # builds the unprocessed release catalog and monitor-fbc-build reports that
    # as the gate's answer.  push-fbc-to-ephemeral-branch commits with
    # --allow-empty and refuses any message not starting with "early-gate:".
    #
    # pathChanged() cannot replace it: on branch creation there is no
    # meaningful diff base, and the processed push may legitimately change
    # nothing.
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push"
      && target_branch.startsWith("eg-fbc-")
      && event_title.startsWith("early-gate:")
  labels:
    appstudio.openshift.io/application: rhoai-early-gate
    appstudio.openshift.io/component: rhoai-fbc-fragment-eg
    pipelines.appstudio.openshift.io/type: build
  name: rhoai-fbc-fragment-eg-on-push
  namespace: rhoai-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  # Must be PUBLIC, for the same reason as the bundle: monitor-fbc-build
  # resolves the digest through quay.io's anonymous registry v2 token, and
  # quay.io/rhoai/rhoai-fbc-fragment answers that with 401.  The component-name
  # lead distinguishes this from the other two artifacts in the shared
  # repository.
  #
  # The value is a fallback - the gate rewrites it on the ephemeral branch to
  # pin the tag to rhoai-fbc-fragment-eg-<leader-pr>.  Kept templated so a
  # failed substitution yields a unique tag the monitor fails to find, rather
  # than a fixed tag that collides between runs.
  #
  # Must stay in step with image-tag on monitor-fbc-build in konflux-central's
  # early-gate/early-gate-component-pipeline.yaml.
  - name: output-image
    value: quay.io/rhoai/pull-request-pipelines:rhoai-fbc-fragment-{{target_branch}}-{{revision}}
  # Both declared by fbc-fragment-build.yaml on konflux-central's rhoai-3.6
  # branch and both passed by rhoai-fbc-fragment-v3-6-push.yaml.
  - name: rhoai-version
    value: "3.6.0"
  - name: build-type
    value: "ci"
  - name: dockerfile
    value: Dockerfile
  # One OCP version, not all of them.  The gate regenerates a single catalog
  # directory, so building the rest would cost time for artifacts nothing in
  # the run consumes.  Keep in step with fbc-openshift-version in the gate.
  - name: path-context
    value: catalog/v4.19
  - name: hermetic
    value: true
  # false, matching rhoai-fbc-fragment-v3-6-push.yaml.  This is the one that
  # matters most: skip-checks also drops validate-fbc, which is what catches a
  # structurally invalid catalog.  verify-fbc-images checks image references,
  # not opm graph validity - nothing else covers it.
  - name: skip-checks
    value: false
  - name: build-source-image
    value: true
  # true, matching the release file.  fbc-fragment-build.yaml is
  # multi-platform-shaped even at one platform: it tags per platform and leaves
  # build-image-index to create the index that carries the plain tag, which is
  # the tag the monitor polls for.
  - name: build-image-index
    value: true
  - name: build-platforms
    value:
    - linux/x86_64
    - linux/ppc64le
    - linux/s390x
    - linux/arm64
  - name: build-args-file
    value: catalog/catalog_build_args.map
  # No skip-fips-check, no enable-slack-* and no enable-downstream-triggers.
  # The POC passes all four, but its fork's fbc-fragment-build.yaml declares
  # them; the one on konflux-central's rhoai-3.6 branch does not, and passing
  # an undeclared parameter fails the PipelineRun at validation.
  #
  # The POC used skip-fips-check to drop fbc-fips-check-oci-ta, whose own 6h
  # timeout does not fit monitor-fbc-build's budget, while keeping
  # validate-fbc.  That separation is not available here - rhoai-3.6 offers
  # only skip-checks, which would take validate-fbc with it - so the FIPS check
  # runs.  If it proves too slow for the monitor, raise
  # fbc-build-timeout-minutes in the gate rather than reaching for skip-checks.
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    # A literal release branch, not '{{ target_branch }}'.  The ephemeral
    # eg-fbc-* branches are created by the gate in THIS repository and will
    # never exist in konflux-central, so target_branch would fail to resolve
    # and no build would start.  Pinned to rhoai-3.6 rather than main so the
    # gate builds with the same pipeline definition the release uses.
    - name: revision
      value: 'rhoai-3.6'
    - name: pathInRepo
      value: pipelines/fbc-fragment-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-rhoai-fbc-fragment-eg
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
