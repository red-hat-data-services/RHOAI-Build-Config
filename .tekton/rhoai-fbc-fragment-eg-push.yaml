apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/red-hat-data-services/RHOAI-Build-Config?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    # Fires when the early gate pushes to an ephemeral eg-fbc-* branch.
    # The push is made by the gate pipeline after it has processed the
    # bundle build and is ready to build the FBC fragment.
    #
    # Two clauses select the processor's commit:
    #   event_title  - the commit message starts with "early-gate:"
    #   branch name  - only ephemeral eg-fbc-* branches
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push"
      && target_branch.startsWith("eg-fbc-")
      && event_title.startsWith("early-gate:")
  labels:
    appstudio.openshift.io/application: rhoai-early-gate
    appstudio.openshift.io/component: rhoai-fbc-fragment-eg
    pipelines.appstudio.openshift.io/type: build
  name: rhoai-fbc-fragment-eg-on-push
  namespace: rhoai-tenant
spec:
  timeouts:
    pipeline: 24h
    tasks: 12h
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/rhoai/pull-request-pipelines:rhoai-fbc-fragment-eg-{{target_branch}}-{{revision}}
  - name: dockerfile
    value: catalog/v4.19/Dockerfile
  - name: path-context
    value: .
  - name: build-source-image
    value: "true"
  - name: skip-fips-check
    value: "true"
  - name: enable-slack-failure-notification
    value: "false"
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    - name: revision
      value: 'main'
    - name: pathInRepo
      value: pipelines/fbc-fragment-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-rhoai-fbc-fragment-eg
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
