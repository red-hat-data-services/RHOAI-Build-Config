apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/red-hat-data-services/RHOAI-Build-Config?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    # No build-nudge-files: this image is deleted with its branch, so a nudge PR
    # would point at nothing. Block 3 takes the digest from the gate's results.
    #
    # One arm only. rhoai-3.6 is already built by odh-operator-bundle-v3-6-push.yaml.
    #
    # The "early-gate:" subject is load-bearing: creating the branch is itself a
    # push, and the fork inherits the release branch's tip commit, so without it
    # PaC builds unprocessed release content and the monitor reports that as the
    # gate's answer. pathChanged() cannot substitute - a new branch has no diff
    # base, and the processed push may legitimately be empty. The push task
    # refuses any other subject, so this holds from both ends.
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push"
      && target_branch.startsWith("eg-bundle-")
      && event_title.startsWith("early-gate:")
  labels:
    appstudio.openshift.io/application: rhoai-early-gate
    appstudio.openshift.io/component: rhods-operator-bundle-eg
    pipelines.appstudio.openshift.io/type: build
  name: rhods-operator-bundle-eg-on-push
  namespace: rhoai-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  # Must be a PUBLIC repo: the monitors resolve digests with quay's anonymous
  # token, which the release repos answer with 401. Shared across the gate's
  # three blocks, hence the component prefix.
  #
  # This value is a fallback - the gate rewrites it on the ephemeral branch to
  # pin the tag. Left templated so a failed rewrite yields a unique tag the
  # monitor fails to find, rather than a fixed one that collides between runs.
  # Must stay character-for-character in step with image-tag on
  # monitor-bundle-build in konflux-central's early-gate pipeline.
  - name: output-image
    value: quay.io/rhoai/pull-request-pipelines:odh-operator-bundle-{{target_branch}}-{{revision}}
  - name: rhoai-version
    value: "3.6.0"
  - name: dockerfile
    value: bundle/Dockerfile
  - name: path-context
    value: .
  - name: hermetic
    value: true
  # No prefetch-input (FROM scratch, nothing to fetch) and no skip-checks, both
  # matching odh-operator-bundle-v3-6-push.yaml: the gate scans what release scans.
  - name: build-source-image
    value: true
  # false, as the release file: container-build.yaml pushes the plain tag, so
  # there is no index to create.
  - name: build-image-index
    value: false
  - name: build-args-file
    value: bundle/bundle_build_args.map
  # No enable-slack-*, enable-downstream-triggers or skip-fips-check. The POC
  # passes them, but container-build.yaml on konflux-central@rhoai-3.6 declares
  # none of them, and an undeclared param fails the run at validation.
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    # A literal branch, not '{{ target_branch }}': the eg-bundle-* branches are
    # created by the gate in THIS repo and never exist in konflux-central, so
    # target_branch would not resolve and no build would start. rhoai-3.6 rather
    # than main so the gate uses the pipeline the release uses. Bump with the branch.
    - name: revision
      value: 'rhoai-3.6'
    - name: pathInRepo
      value: pipelines/container-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-rhods-operator-bundle-eg
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
