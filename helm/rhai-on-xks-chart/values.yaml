  cloudManager:
    # Cloud Manager operator namespace
    namespace: rhai-cloudmanager-system
    # Cloud Manager container image
    image: "registry.redhat.io/rhoai/odh-rhel9-operator@sha256:9ec7564d2769b8ce0c978ae671005ae5c5fd085f4815942a4ece4668b4595305"
    # Image pull policy
