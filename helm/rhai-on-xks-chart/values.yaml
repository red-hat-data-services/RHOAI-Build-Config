  # relatedImages:
  #   - name: RELATED_IMAGE_ODH_KSERVE_CONTROLLER_IMAGE
  #     value: quay.io/opendatahub/kserve-controller:latest

hooks:
  cliImage: "registry.redhat.io/openshift4/ose-cli-rhel9@sha256:050b7df556b47c541259a290f7eb80ecb483610eabadd371ab0b5873dd816b7e"
  # Default resources for all hook job containers
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 64Mi
  postInstallCrs:
    enabled: true

# Cluster wise config for gateway for tls, shared config for all components section below
gateway:
  # External hostname e.g. "*.mycompany.com", if empty, only cluster-internal DNS (svc.cluster.local) to use
  hostname: ""
  tls:
    # When false, gateways are HTTP only
    enabled: true
    # Default is set to use rhai managed internal CA, handled by operator
    # to bring your own ClusterIssuer/Issuer (e.g. Let's Encrypt), ensure it is Ready in the cluster before config it below
    issuerRef:
      name: rhai-ca-issuer
      kind: ClusterIssuer
    # Extra dnsNames added to the certificate (multi-domain / wildcard).
    additionalSANs: []

# Components configuration
components:
  kserve:
    # Create Kserve CR via post-install hook
    enabled: true
    spec:
      modelExpress:
        managementState: Removed
    # Gateway configuration for KServe inference
    gateway:
      # Create Gateway and ConfigMaps via post-install hook
      create: true
      # Which namespaces can attach HTTPRoutes to the Gateway (Selector or Same).
      # Required — chart will fail if not set.
      # When using Selector, the specified labels must be applied to each target namespace.
      # Example:
      #   allowedRoutes:
      #     namespaces:
      #       from: Selector
      #       selector:
      #         matchLabels:
      #           your-label: "true"
      allowedRoutes:
        namespaces: {}

  aigateway:
    # Enable operator-managed AIGateway module (includes Models as a Service)
    enabled: false
    # AIGateway component CR spec — MaaS and Batch Gateway default to Removed.
    spec:
      modelsAsAService:
        managementState: Removed
      # Batch Gateway lifecycle. Keep Removed until its RHAII release default is confirmed.
      batchGateway:
        managementState: Removed
    # Models as a Service (MaaS) configuration
    modelsAsAService:
      # MaaS gateway configuration
      gateway:
        # Create MaaS Gateway, certs, and CA bundles via post-install hook
        create: true
        # Namespace for the MaaS Gateway (defaults to the applications namespace)
        namespace: ""
        # Name for the MaaS Gateway resource
        name: maas-default-gateway
        # GatewayClass to use for the MaaS Gateway
        gatewayClassName: istio
        # Which namespaces can attach HTTPRoutes to the MaaS Gateway (Selector or Same).
        # Required — chart will fail if not set.
        # When using Selector, the specified labels must be applied to each target namespace.
        # Example:
        #   allowedRoutes:
        #     namespaces:
        #       from: Selector
        #       selector:
        #         matchLabels:
        #           maas-gateway-access: "true"
        allowedRoutes:
          namespaces: {}

# Azure cloud configuration
azure:
  enabled: false
  cloudManager:
    # Cloud Manager operator namespace
    namespace: rhai-cloudmanager-system
    # Cloud Manager container image
    image: "registry.redhat.io/rhoai/odh-rhel9-operator@sha256:21859665b5b666daa728bbbc1c80b4a67ebb5fe71550f496e3911af66f62e243"
    # Image pull policy
    imagePullPolicy: Always
    # Number of cloud manager replicas
    replicas: 1
    # Resources for the cloud manager container
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi
  kubernetesEngine:
    # Create AzureKubernetesEngine CR via post-install hook
    enabled: true
    spec:
      dependencies:
        gatewayAPI:
          managementPolicy: Managed
          configuration: {}
        lws:
          managementPolicy: Unmanaged   # Required only when need run WideEP, set to Managed then
          configuration:
            namespace: openshift-lws-operator
        sailOperator:
          managementPolicy: Managed
          configuration:
            namespace: istio-system
        rhcl:
          managementPolicy: Unmanaged   # Opt-in: set to Managed to have CCM install RHCL (Kuadrant)
          configuration:
            operatorNamespace: kuadrant-operators
            operandNamespace: kuadrant-system

