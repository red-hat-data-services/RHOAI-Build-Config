# cert-manager operator subchart
cert-manager-operator:
  # When true (default), RHAI installs cert-manager via this subchart.
  # Set enabled=false if the cluster has an external cert-manager you don't want RHAI to manage.
  enabled: true
  operatorNamespace: cert-manager-operator
  operandNamespace: cert-manager
  imagePullSecrets:
    - name: rhai-pull-secret
  bundle:
    version: "v1.18.1"

# XKS Gateway subchart — platform auth gateway (GatewayConfig CRD, namespace, CR, OIDC).
# Disabled by default because the platform auth gateway is opt-in. When enabled, the
# xks-gateway subchart installs or updates the GatewayConfig CRD. Gateway resources
# (namespace, GatewayConfig CR, OIDC Secret) are only created when gateway.domain is set.
# If disabled or unconfigured on upgrade, the subchart's cleanup hook removes the
# release-owned GatewayConfig by default; set cleanupOnDisable=false to retain it.
# Set xks-gateway.enabled=true together with the gateway domain and OIDC values to enable it.
# Enabling this subchart also enables the RHAI operator GatewayConfig controller.
xks-gateway:
  # -- Enable platform auth gateway resources. Helm retains an installed GatewayConfig CRD when disabled.
  enabled: false
  # -- Clean up the release-owned GatewayConfig when disabled or unconfigured on upgrade.
  cleanupOnDisable: true
  hooks:
    # The chart-managed Secret exists before upgrade/delete hooks and is created
    # before post-install/post-upgrade hooks run.
    imagePullSecretName: rhai-pull-secret
    cliImage: registry.redhat.io/openshift4/ose-cli-rhel9:v4.20@sha256:d876c1d98b39d65c00c4261431bb84b90284699f3aef84d8701a25c786fb79a1
    resources:
      limits:
        cpu: 200m
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 64Mi
  gateway:
    domain: ""
    subdomain: ""
    ingressMode: LoadBalancer
    namespace: rh-ai-gateway
    certificate:
      type: SelfSigned
      secretName: ""
    oidc:
      issuerURL: ""
      clientID: ""
      oidcClientSecret: ""
      clientSecretRef:
        name: ""
        key: client-secret
      secretNamespace: ""
    cookie:
      expire: "24h"
      refresh: "1h"
    providerCASecretName: ""
    verifyProviderCertificate: true
    networkPolicy:
      ingress:
        enabled: true

# Pull secret for private registries
# Use --set-file imagePullSecret.dockerConfigJson=path/to/auth.json
imagePullSecret:
  # Name of the pull secret to create in target namespaces. This name MUST not be changed
  # as it is referred also in other installed dependencies and not yet configurable.
  name: rhai-pull-secret
  # Docker config JSON content (populated via --set-file)
  dockerConfigJson: ""
  # Namespaces created by dependency operators where pull secrets should be injected
  dependencyNamespaces: []
