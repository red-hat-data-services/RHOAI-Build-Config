name: Insta Merge FBC Nudges

on:
  pull_request:
    branches:
      - 'rhoai-[23].[0-9]'  # e.g. rhoai-2.1, rhoai-3.1, rhoai-3.4
      - 'rhoai-[23].[0-9][0-9]'  # e.g. rhoai-2.10, rhoai-3.10, rhoai-3.22
      - 'rhoai-[3].[0-9]-ea.[0-9]'  # e.g. rhoai-3.4-ea.1, rhoai-3.5-ea.2
      - 'rhoai-[3].[0-9][0-9]-ea.[0-9]'  # e.g. rhoai-3.10-ea.3
    types:
      - opened
      - reopened
      - edited
    paths:
      - catalog/catalog-patch.yaml
      - schedule/catalog-github-trigger.txt

env:
  GITHUB_ORG: red-hat-data-services
  GITHUB_RKA_ORG: red-hat-data-services
  RESOLVE_CONFLICTS_FOR: 'catalog/catalog-patch.yaml,schedule/catalog-github-trigger.txt'


permissions:
  contents: write
  pull-requests: write
  checks: write
  security-events: write
  statuses: write

jobs:
  check-files:
    if: ${{ (github.event.sender.login == 'konflux-internal-p02[bot]' || github.event.sender.login == 'dchourasia')  && contains(github.event.pull_request.title, 'update odh-operator-bundle-')}}
    runs-on: ubuntu-latest
    outputs:
      feasible: ${{ steps.merge-feasibility-check.outputs.FEASIBLE }}
      base_branch: ${{ steps.merge-feasibility-check.outputs.BASE_BRANCH }}
      head_branch: ${{ steps.merge-feasibility-check.outputs.HEAD_BRANCH }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Check changed files
        id: changed-files
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            catalog_patch:
              - 'catalog/catalog-patch.yaml'
            trigger:
              - 'schedule/catalog-github-trigger.txt'
            all:
              - '**'

      - name: Merge Feasibility Check
        if: ${{ steps.changed-files.outputs.all_count == '1' && (steps.changed-files.outputs.catalog_patch == 'true' || steps.changed-files.outputs.trigger == 'true') }}
        id: merge-feasibility-check
        run: |
          # Declare variables
          BASE_BRANCH=${GITHUB_BASE_REF:-${GITHUB_REF#refs/heads/}}
          HEAD_BRANCH=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
          VERSION=v${BASE_BRANCH/rhoai-/}
          SUFFIX=${VERSION//./-}
          echo "SUFFIX=$SUFFIX"
          echo "HEAD_BRANCH=$HEAD_BRANCH"
          TITLE="${{ github.event.pull_request.title }}"

          if [[ $TITLE == chore\(deps\)* ]]
          then
            TITLE=${TITLE/chore\(deps\): u/U}
          fi
          REGEX="^Update.*-$SUFFIX to [0-9a-z]{1,40}$"

          FEASIBLE=No
          #Check if PR title is as per the convention
          if [[ "$TITLE" =~ $REGEX ]]
          then
            FEASIBLE=Yes
            echo "It's a valid PR to merge!"
          else
            echo "Insta-merge not configured to merge this PR, skipping."
          fi
          echo "FEASIBLE=$FEASIBLE" >> $GITHUB_OUTPUT
          echo "BASE_BRANCH=$BASE_BRANCH" >> $GITHUB_OUTPUT
          echo "HEAD_BRANCH=$HEAD_BRANCH" >> $GITHUB_OUTPUT

  merge:
    needs: check-files
    if: ${{ needs.check-files.outputs.feasible == 'Yes' }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate github-app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RHOAI_DEVOPS_APP_ID }}
          private-key: ${{ secrets.RHOAI_DEVOPS_APP_PRIVATE_KEY }}

      - uses: Wandalen/wretry.action@6feedb7dedadeb826de0f45ff482b53b379a7844 # v3.5.0
        with:
          action: red-hat-data-services/insta-merge@d5a235a825db7830227d5e48bc1e3cc4f37dc491 # main (amd64 gh CLI; RHAI-15286)
          retry_condition: steps._this.outputs.code == 0
          attempt_limit: 5
          github_token: ${{ steps.app-token.outputs.token }}
          with: |
            upstream_repo: "https://github.com/${GITHUB_ORG}/RHOAI-Build-Config.git"
            upstream_branch: "${{ needs.check-files.outputs.base_branch }}"
            downstream_repo: "https://github.com/${GITHUB_ORG}/RHOAI-Build-Config.git"
            downstream_branch: "${{ needs.check-files.outputs.head_branch }}"
            token: ${{ steps.app-token.outputs.token }}
            resolve_conflicts_for: "${RESOLVE_CONFLICTS_FOR}"
            merge_args: "--no-edit"
            pr_url: "${{ github.event.pull_request.html_url }}"

      - name: Retry and verify PR merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          for attempt in 1 2 3 4 5; do
            if state="$(gh pr view "$PR_URL" --json state --jq .state)"; then
              if [[ "$state" == "MERGED" ]]; then
                echo "Verified PR is merged."
                exit 0
              fi
              if [[ "$state" != "OPEN" ]]; then
                echo "::error::Cannot merge PR in state '$state'."
                exit 1
              fi
            else
              echo "::warning::GitHub API query failed on attempt $attempt."
            fi

            if ! gh pr merge "$PR_URL" --merge --admin; then
              echo "::warning::PR merge attempt $attempt failed; will retry."
            fi
            sleep $((attempt * 3))
          done

          state="$(gh pr view "$PR_URL" --json state --jq .state)" || {
            echo "::error::Could not verify PR state after merge retries."
            exit 1
          }
          if [[ "$state" != "MERGED" ]]; then
            echo "::error::PR is still '$state' after merge retries."
            exit 1
          fi
          echo "Verified PR is merged."
