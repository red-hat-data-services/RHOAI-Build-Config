name: Trigger Nightly FBC Build
run-name: Trigger Nightly FBC Build
on:
  workflow_dispatch:
  push:
    paths:
      - schedule/catalog-github-trigger.txt
    branches:
      - 'rhoai-[23].[0-9]'  # e.g. rhoai-2.1, rhoai-3.1, rhoai-3.4
      - 'rhoai-[23].[0-9][0-9]'  # e.g. rhoai-2.10, rhoai-3.10, rhoai-3.22
      - 'rhoai-[3].[0-9]-ea.[0-9]'  # e.g. rhoai-3.4-ea.1, rhoai-3.5-ea.2
      - 'rhoai-[3].[0-9][0-9]-ea.[0-9]'  # e.g. rhoai-3.10-ea.3
permissions:
  contents: write

env:
  GITHUB_ORG: red-hat-data-services
  # INCLUDE_RELEASES provides the flexibility to include no additional bundles
  # or any number of additional bundles through a comma-separated list of
  # release branch names. The current branch's bundle is always included.
  # For example:
  # - INCLUDE_RELEASES: "": include only the bundle from the current branch.
  # - INCLUDE_RELEASES: "rhoai-2.25": include the bundles from the current
  #   branch and rhoai-2.25.
  # - INCLUDE_RELEASES: "rhoai-3.4, rhoai-3.5-ea.1, rhoai-3.5-ea.2": include
  #   the bundle from the current branch and the latest bundles from all three
  #   listed release branches.
  # Each bundle is processed only for OCP versions listed in its branch's
  # build-config.yaml.
  INCLUDE_RELEASES: ""
jobs:
  refresh-pcc:
    if: ${{ github.ref_name != 'main' }}
    uses: red-hat-data-services/RHOAI-Build-Config/.github/workflows/refresh-pcc.yaml@main
    secrets:
      REGISTRY_REDHAT_IO_USERNAME: ${{ secrets.REGISTRY_REDHAT_IO_USERNAME }}
      REGISTRY_REDHAT_IO_PASSWORD: ${{ secrets.REGISTRY_REDHAT_IO_PASSWORD }}
      RHOAI_DEVOPS_APP_ID: ${{ secrets.RHOAI_DEVOPS_APP_ID }}
      RHOAI_DEVOPS_APP_PRIVATE_KEY: ${{ secrets.RHOAI_DEVOPS_APP_PRIVATE_KEY }}

  process-fbc:
    if: ${{ github.ref_name != 'main' }}
    needs: refresh-pcc
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    container:
      image: quay.io/rhoai-devops/olm-runner:latest
      options: --privileged
    steps:
      - name: Get Current branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: get_branch
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RHOAI_DEVOPS_APP_ID }}
          private-key: ${{ secrets.RHOAI_DEVOPS_APP_PRIVATE_KEY }}
          owner: red-hat-data-services
          repositories: RHOAI-Build-Config
      - name: Git checkout RBC main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          path: main
          sparse-checkout: |
            pcc
            catalog/${{ steps.get_branch.outputs.branch }}
            config
          sparse-checkout-cone-mode: false
      - name: Git checkout RBC release
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ steps.get_branch.outputs.branch }}
          path: ${{ steps.get_branch.outputs.branch }}
      - name: Git checkout utils
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.GITHUB_ORG }}/RHOAI-Konflux-Automation
          ref: main
          path: utils
      # Included releases supply catalog inputs; only the current release checkout is pushed.
      - name: Git clone included releases
        env:
          BRANCH: ${{ steps.get_branch.outputs.branch }}
        run: |
          IFS=',' read -r -a EXTRA_RELEASES <<< "${INCLUDE_RELEASES}"
          for RAW in "${EXTRA_RELEASES[@]}"; do
            REL="${RAW//[[:space:]]/}"
            [[ -z "${REL}" || "${REL}" == "${BRANCH}" ]] && continue
            [[ -d "${REL}" ]] && continue
            git clone --branch "${REL}" --single-branch --depth 1 \
              "https://github.com/${GITHUB_REPOSITORY}.git" "${REL}"
          done
      - name: Install Python dependencies
        run: pip install --default-timeout=100 -r utils/utils/processors/requirements.txt
      - name: Login to Quay
        env:
          RHOAI_QUAY_RO_USERNAME: ${{ secrets.RHOAI_QUAY_RO_USERNAME }}
          RHOAI_QUAY_RO_TOKEN: ${{ secrets.RHOAI_QUAY_RO_TOKEN }}
        run: |
          skopeo login -u "${RHOAI_QUAY_RO_USERNAME}" -p "${RHOAI_QUAY_RO_TOKEN}" quay.io/rhoai

      - name: Process FBC Fragment
        env:
          BRANCH: ${{ steps.get_branch.outputs.branch }}
          PYTHONPATH: utils/utils/processors
        run: |
          set -euo pipefail

          WORK_DIR=utils/fbc-work
          TEMPLATE_SRC=utils/utils/processors/templates/fbc-semver-template.yaml
          PROCESSOR=utils/utils/processors/fbc-processor.py
          mkdir -p "$WORK_DIR"

          # Step 1: Resolve bundle image digests and Git metadata for each release via skopeo.
          # Store results in BUNDLE_IMAGES, GIT_URLS, and GIT_COMMITS, aligned with RELEASES.
          # The current branch is always first; branches from INCLUDE_RELEASES are appended in order.
          RELEASES=("$BRANCH")
          IFS=',' read -r -a EXTRA_RELEASES <<< "$INCLUDE_RELEASES"
          for RAW in "${EXTRA_RELEASES[@]}"; do
            REL="${RAW//[[:space:]]/}"
            [[ -z "$REL" ]] && continue
            ALREADY_INCLUDED=false
            for INCLUDED in "${RELEASES[@]}"; do
              if [[ "$REL" == "$INCLUDED" ]]; then
                ALREADY_INCLUDED=true
                break
              fi
            done
            [[ "$ALREADY_INCLUDED" == true ]] || RELEASES+=("$REL")
          done

          # Resolve each bundle once so all OCP catalogs use the same digest.
          BUNDLE_IMAGES=()
          GIT_URLS=()
          GIT_COMMITS=()
          for REL in "${RELEASES[@]}"; do
            # Nightly catalogs use the release-nightly tag.
            INSPECT=$(skopeo inspect --no-tags "docker://quay.io/rhoai/odh-operator-bundle:${REL}-nightly")
            DIGEST=$(jq -er '.Digest | select(type == "string" and startswith("sha256:"))' <<< "$INSPECT")
            GIT_URL=$(jq -er '.Labels["git.url"] | select(type == "string" and length > 0)' <<< "$INSPECT")
            GIT_COMMIT=$(jq -er '.Labels["git.commit"] | select(type == "string" and length > 0)' <<< "$INSPECT")
            IMAGE="quay.io/rhoai/odh-operator-bundle@${DIGEST}"
            echo "Resolved ${REL}: ${IMAGE}"
            BUNDLE_IMAGES+=("$IMAGE")
            GIT_URLS+=("$GIT_URL")
            GIT_COMMITS+=("$GIT_COMMIT")
          done

          # Step 2: Generate Single Bundle Catalog(SBC) for each release in both bundle-object and CSV-metadata formats.
          for INDEX in "${!RELEASES[@]}"; do
            REL="${RELEASES[$INDEX]}"
            TEMPLATE="$WORK_DIR/${REL}-sbc-template.yaml"
            cp "$TEMPLATE_SRC" "$TEMPLATE"
            IMAGE="${BUNDLE_IMAGES[$INDEX]}" yq e -i '.stable.bundles[0].image = env(IMAGE)' "$TEMPLATE"
            opm alpha render-template semver -o yaml "$TEMPLATE" \
              > "$WORK_DIR/${REL}-bundle-object-sbc.yaml"
            opm alpha render-template semver \
              --migrate-level=bundle-object-to-csv-metadata -o yaml "$TEMPLATE" \
              > "$WORK_DIR/${REL}-csv-metadata-sbc.yaml"
          done

          # Step 3: For each OCP version, chain up to N passes (one per supported release).
          # Pass 1 reads PCC base catalog, each subsequent pass reads the previous pass's output.
          # Read each release's supported OCP versions in the same order as RELEASES.
          SUPPORTED_OCP_VERSIONS=()
          for REL in "${RELEASES[@]}"; do
            if ! SUPPORTED=$(yq e -e '.config.supported-ocp-versions.build[].name' "$REL/config/build-config.yaml"); then
              echo "::error::Could not read supported OCP versions for $REL" >&2
              exit 1
            fi
            SUPPORTED_OCP_VERSIONS+=("$SUPPORTED")
          done
          OCP_VERSIONS="${SUPPORTED_OCP_VERSIONS[0]}"
          while IFS= read -r OCP_VERSION; do
            if [[ "$OCP_VERSION" =~ ^v([0-9]+)\.([0-9]+)$ ]]; then
              OCP_MAJOR="${BASH_REMATCH[1]}"
              OCP_MINOR="${BASH_REMATCH[2]}"
            else
              echo "::error::Unsupported OCP version: $OCP_VERSION" >&2
              exit 1
            fi
            OUTPUT_CATALOG="$BRANCH/catalog/$OCP_VERSION/rhods-operator/catalog.yaml"
            mkdir -p "$(dirname "$OUTPUT_CATALOG")"
            INPUT_CATALOG="main/pcc/catalog-$OCP_VERSION.yaml"

            for INDEX in "${!RELEASES[@]}"; do
              REL="${RELEASES[$INDEX]}"
              if ! grep -Fxq -- "$OCP_VERSION" <<< "${SUPPORTED_OCP_VERSIONS[$INDEX]}"; then
                echo "Skipping $REL for $OCP_VERSION: not listed in its supported build OCP versions"
                continue
              fi
              COMPONENT_SUFFIX="v${REL#rhoai-}"
              COMPONENT_SUFFIX="${COMPONENT_SUFFIX//./-}"
              SBC="$WORK_DIR/${REL}-bundle-object-sbc.yaml"
              # OCP 4.17 and later, including 5.x, require CSV metadata.
              if (( OCP_MAJOR > 4 || (OCP_MAJOR == 4 && OCP_MINOR >= 17) )); then
                SBC="$WORK_DIR/${REL}-csv-metadata-sbc.yaml"
              fi

              printf '%s\n' \
                '######################################################################' \
                "### Processing OCP ${OCP_VERSION} catalog with ${REL} bundle" \
                '######################################################################'
              # Keep each processor call's DEBUG log; the logger overwrites its file on startup.
              LOG_FILE_DIR="$WORK_DIR" LOG_FILE_NAME="fbc-processor-${REL}-${OCP_VERSION}.log" \
                python3 "$PROCESSOR" \
                --rhoai-version "$REL" \
                --build-type nightly \
                --build-config-path "$REL/config/build-config.yaml" \
                --patch-yaml-path "$REL/catalog/catalog-patch.yaml" \
                --single-bundle-catalog-path "$SBC" \
                --input-catalog-path "$INPUT_CATALOG" \
                --output-catalog-path "$OUTPUT_CATALOG" \
                --bundle-git-url "${GIT_URLS[$INDEX]}" \
                --bundle-git-commit "${GIT_COMMITS[$INDEX]}" \
                --catalog-build-args-file-path "$REL/catalog/catalog_build_args.map" \
                --push-pipeline-yaml-path "$REL/.tekton/rhoai-fbc-fragment-${COMPONENT_SUFFIX}-push.yaml" \
                --push-pipeline-operation disable
              # Chain: next pass reads this pass's output as input.
              INPUT_CATALOG="$OUTPUT_CATALOG"
            done
          done <<< "$OCP_VERSIONS"

          date +'%d-%m-%Y %H:%M:%S:%3N' > "$BRANCH/schedule/catalog-tekton-trigger.txt"

      - name: Print debug logs
        if: always()
        run: |
          LOG_FILES=(utils/fbc-work/fbc-processor-*.log)
          if [[ ! -f "${LOG_FILES[0]}" ]]; then
            echo "No FBC processor debug logs found"
            exit 0
          fi
          for LOG_FILE in "${LOG_FILES[@]}"; do
            echo "=== ${LOG_FILE} ==="
            cat "$LOG_FILE"
          done

      - name: Upload FBC processor debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fbc-processor-debug-logs
          path: utils/fbc-work/fbc-processor-*.log
          if-no-files-found: ignore

      - name: Validate Catalogs
        id: validate-catalogs
        env:
          BRANCH: ${{ steps.get_branch.outputs.branch }}
        run: |
          BUILD_CONFIG_PATH=${BRANCH}/config/build-config.yaml
          SHIPPED_RHOAI_VERSIONS_PATH=main/pcc/released_rhoai_versions.txt
          CATALOG_FOLDER_PATH=${BRANCH}/catalog
          GLOBAL_CONFIG_PATH=main/config/new-config.yaml

          PYTHONPATH=utils/utils/processors python3 -m validator.catalog_validator \
            -op validate-catalogs \
            --build-config-path ${BUILD_CONFIG_PATH} \
            --catalog-folder-path ${CATALOG_FOLDER_PATH} \
            --shipped-rhoai-versions-path ${SHIPPED_RHOAI_VERSIONS_PATH} \
            --global-config-path ${GLOBAL_CONFIG_PATH}

      - name: Commit and push the changes to release branch
        working-directory: ${{ steps.get_branch.outputs.branch }}
        run: |
          git config user.name "Openshift-AI DevOps"
          git config user.email "openshift-ai-devops@redhat.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Updating the catalog.yaml with latest images and patches" && git push origin ${{ steps.get_branch.outputs.branch }})

  notify-failure:
    needs: [refresh-pcc, process-fbc]
    if: ${{ failure() }}
    uses: red-hat-data-services/RHOAI-Build-Config/.github/workflows/slack-failure-notification.yaml@main
    with:
      workflow_name: "Nightly FBC Build"
      branch: ${{ github.head_ref || github.ref_name }}
      run_url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
    secrets:
      SLACK_NOTIFICATIONS_WEBHOOK: ${{ secrets.SLACK_NOTIFICATIONS_WEBHOOK }}
