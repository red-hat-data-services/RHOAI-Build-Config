patch:
  olm.package:
    name: rhods-operator
    defaultChannel: stable-3.x
  olm.channels:
    - name: stable-3.x
      package: rhods-operator
      schema: olm.channel
      entries:
        - name: rhods-operator.3.5.1
          replaces: rhods-operator.3.5.0
          skipRange: '>=3.4.0 <3.5.1'
    - name: stable-3.5
      package: rhods-operator
      schema: olm.channel
      entries:
        - name: rhods-operator.3.5.1
          skipRange: '>=3.4.0 <3.5.1'
    - name: eus-3.5
      package: rhods-operator
      schema: olm.channel
      entries:
        - name: rhods-operator.3.5.1
    - name: support-required-upgrade-3.5
      package: rhods-operator
      schema: olm.channel
      entries:
      - name: rhods-operator.3.5.1
        skipRange: '>=2.25.11 <2.26.0'

  olm.bundle:
    - quay.io/rhoai/odh-operator-bundle@sha256:c72d270ba663b56afa0a57351f3c503f7c4618852e946cdfb5b1ce44665ed312
    # only for nudging purpose
