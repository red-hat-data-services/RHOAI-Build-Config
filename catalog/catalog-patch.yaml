patch:
  olm.package:
    name: rhods-operator
    defaultChannel: stable-3.x
  olm.channels:
    - name: stable-3.x
      package: rhods-operator
      schema: olm.channel
      entries:
        - name: rhods-operator.3.5.1
          replaces: rhods-operator.3.5.0
          skipRange: '>=3.4.0 <3.5.1'
    - name: stable-3.5
      package: rhods-operator
      schema: olm.channel
      entries:
        - name: rhods-operator.3.5.1
          skipRange: '>=3.4.0 <3.5.1'
    - name: eus-3.5
      package: rhods-operator
      schema: olm.channel
      entries:
        - name: rhods-operator.3.5.1
    - name: support-required-upgrade-3.5
      package: rhods-operator
      schema: olm.channel
      entries:
      - name: rhods-operator.3.5.1
        skipRange: '>=2.25.11 <2.26.0'

  olm.bundle:
    - quay.io/rhoai/odh-operator-bundle@sha256:c7630cf48eed9a270826e119c79d5e670ceeacac7a30abcedb24f78b32ed60d4
    # only for nudging purpose
