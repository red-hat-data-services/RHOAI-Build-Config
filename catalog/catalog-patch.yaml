patch:
  olm.package:
    name: rhods-operator
    defaultChannel: stable-3.x
  olm.channels:
    - name: stable-3.x
      package: rhods-operator
      schema: olm.channel
      entries:
        - name: rhods-operator.3.5.1
          replaces: rhods-operator.3.5.0
          skipRange: '>=3.4.0 <3.5.1'
    - name: stable-3.5
      package: rhods-operator
      schema: olm.channel
      entries:
        - name: rhods-operator.3.5.1
          skipRange: '>=3.4.0 <3.5.1'
    - name: eus-3.5
      package: rhods-operator
      schema: olm.channel
      entries:
        - name: rhods-operator.3.5.1
    - name: support-required-upgrade-3.5
      package: rhods-operator
      schema: olm.channel
      entries:
      - name: rhods-operator.3.5.1
        skipRange: '>=2.25.11 <2.26.0'

  olm.bundle:
    - quay.io/rhoai/odh-operator-bundle@sha256:0cd73795bc0e69a17a0e6961c6be3e83daa392576ac8a11809b1e5c074e323c1
    # only for nudging purpose
